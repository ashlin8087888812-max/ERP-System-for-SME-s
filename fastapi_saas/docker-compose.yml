services:
  fastapi:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/saas_db
      - REDIS_URL=redis://redis-pubsub:6379/0
      - REDIS_PUBSUB_URL=redis://redis-pubsub:6379/0
      - REDIS_CELERY_BROKER_URL=redis://redis-celery:6379/0
      - REDIS_CELERY_RESULT_URL=redis://redis-celery:6379/1
      - CELERY_BROKER_URL=redis://redis-celery:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-celery:6379/1
      - ENABLE_METRICS=true
      - SENTRY_DSN=
      - SECRET_KEY=super-secret-key-change-this-in-production-1234567890
      # Observability
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=syncerity-api
      - LOKI_ENABLED=true
      - LOKI_URL=http://loki:3100
    depends_on:
      - postgres
      - redis-pubsub
      - redis-celery

  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saas_db
    ports:
      - "5432:5432"

  # Redis for WebSocket Pub/Sub
  redis-pubsub:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-pubsub-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction

  # Redis for Celery broker and results
  redis-celery:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-celery-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  celery_worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/saas_db
      - REDIS_URL=redis://redis-pubsub:6379/0
      - REDIS_CELERY_BROKER_URL=redis://redis-celery:6379/0
      - REDIS_CELERY_RESULT_URL=redis://redis-celery:6379/1
      - CELERY_BROKER_URL=redis://redis-celery:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-celery:6379/1
    depends_on:
      - redis-celery
      - postgres

  flower:
    image: mher/flower
    command: celery flower
    environment:
      - CELERY_BROKER_URL=redis://redis-celery:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis-celery

  # === MONITORING STACK ===

  # Grafana Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  # Promtail - Log shipping agent
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./logs:/var/log/app:ro
      - ./ops/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./ops/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./ops/dashboards:/etc/grafana/provisioning/dashboards/json
    depends_on:
      - loki
      - prometheus

  # Jaeger - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.51
    ports:
      - "16686:16686" # UI
      - "14268:14268" # Collector HTTP
      - "14250:14250" # gRPC
      - "6831:6831/udp" # Agent compact thrift
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Prometheus - Metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

volumes:
  postgres_data:
  redis-pubsub-data:
  redis-celery-data:
  loki-data:
  grafana-data:
  prometheus-data:
