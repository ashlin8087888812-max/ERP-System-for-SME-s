# Nginx JSON logging configuration for edge/proxy logging
# Include this in your nginx.conf

log_format json_combined escape=json
'{'
  '"timestamp":"$time_iso8601",'
  '"service":"nginx-proxy",'
  '"correlation_id":"$http_x_correlation_id",'
  '"remote_addr":"$remote_addr",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"http_referer":"$http_referer",'
  '"http_user_agent":"$http_user_agent",'
  '"request_time":$request_time,'
  '"upstream_response_time":"$upstream_response_time",'
  '"ssl_protocol":"$ssl_protocol",'
  '"ssl_cipher":"$ssl_cipher"'
'}';

# Apply to access log
access_log /var/log/nginx/access.log json_combined;

# Example server block with correlation ID propagation
server {
    listen 80;
    server_name example.com;
    
    location / {
        # Forward correlation ID to backend
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        
        # If not present, generate one (requires nginx with uuid)
        # set $correlation_id $http_x_correlation_id;
        # if ($correlation_id = "") {
        #     set $correlation_id $request_id;
        # }
        # proxy_set_header X-Correlation-ID $correlation_id;
        
        proxy_pass http://backend:8000;
    }
}
